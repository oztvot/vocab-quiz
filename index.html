const STORAGE_KEY = "vocabApp_sets";
let currentUser = null;
let useCloud = false;
let cloudSetsCache = null;

/* ===== 로그인 상태 관리 ===== */
function loginWithGoogle(){
  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider).catch(err => alert('로그인 실패: ' + err.message));
}
function logout(){ auth.signOut(); }

function updateAuthUI(){
  const el = document.getElementById('authStatus');
  if(currentUser){
    el.innerHTML = `☁️ <b>${currentUser.displayName || '사용자'}</b>님 (동기화 중)
      <button class="small danger" onclick="logout()">로그아웃</button>`;
  } else {
    el.innerHTML = `📱 게스트 모드 (이 기기에만 저장)
      <button class="small secondary" onclick="loginWithGoogle()">Google 로그인으로 동기화</button>`;
  }
}

auth.onAuthStateChanged(user => {
  if(user){
    currentUser = user;
    useCloud = true;
    cloudSetsCache = null;
    updateAuthUI();
    fetchCloudSets();
  } else {
    currentUser = null;
    useCloud = false;
    updateAuthUI();
    renderSetList();
  }
});

async function fetchCloudSets(){
  const docRef = db.collection('users').doc(currentUser.uid);
  const snap = await docRef.get();
  if(snap.exists && snap.data().sets){
    cloudSetsCache = snap.data().sets;
  } else {
    cloudSetsCache = [{
      id: "default_unit01",
      name: "PART5 UNIT01 동사 어휘",
      words: DEFAULT_WORDS,
      selected: true,
      mastered: false
    }];
    await docRef.set({ sets: cloudSetsCache });
  }
  renderSetList();
}

/* ===== 저장소 (게스트=localStorage / 로그인=Firestore) ===== */
function loadSets(){
  if(useCloud){
    return cloudSetsCache || [];
  }
  let raw = localStorage.getItem(STORAGE_KEY);
  if(!raw){
    const initial = [{
      id: "default_unit01",
      name: "PART5 UNIT01 동사 어휘",
      words: DEFAULT_WORDS,
      selected: true,
      mastered: false
    }];
    localStorage.setItem(STORAGE_KEY, JSON.stringify(initial));
    return initial;
  }
  return JSON.parse(raw);
}

function saveSets(sets){
  if(useCloud){
    cloudSetsCache = sets;
    db.collection('users').doc(currentUser.uid).set({ sets })
      .catch(err => alert('동기화 오류: ' + err.message));
  } else {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(sets));
  }
}

function renderSetList(){
  const sets = loadSets();
  const container = document.getElementById('setList');
  if(sets.length === 0){
    container.innerHTML = '<p>저장된 단어장이 없습니다.</p>';
    return;
  }
  container.innerHTML = sets.map(s => `
    <div class="set-item ${s.mastered ? 'mastered':''}">
      <label class="set-label">
        <input type="checkbox" ${s.selected ? 'checked':''} onchange="toggleSelected('${s.id}', this.checked)">
        <b>${s.name}</b> (${s.words.length}개) ${s.mastered ? '✅' : ''}
      </label>
      <div class="set-actions">
        <button class="small secondary" onclick="toggleMastered('${s.id}')">${s.mastered ? '복습하기' : '완료 표시'}</button>
        <button class="small danger" onclick="deleteSet('${s.id}')">삭제</button>
      </div>
    </div>
  `).join('');
}

function toggleSelected(id, checked){
  const sets = loadSets();
  sets.find(x => x.id === id).selected = checked;
  saveSets(sets);
}
function toggleMastered(id){
  const sets = loadSets();
  const s = sets.find(x => x.id === id);
  s.mastered = !s.mastered;
  s.selected = !s.mastered;
  saveSets(sets);
  renderSetList();
}
function deleteSet(id){
  if(!confirm('이 단어장을 삭제할까요?')) return;
  saveSets(loadSets().filter(x => x.id !== id));
  renderSetList();
}
function selectAllSets(value){
  const sets = loadSets();
  sets.forEach(s => s.selected = value);
  saveSets(sets);
  renderSetList();
}

/* ===== 텍스트 파싱 ===== */
function smartParseLine(rawLine){
  let text = rawLine.replace(/^\s*\d+\s*/, '').trim();
  if(!text) return null;
  const hangulIdx = text.search(/[가-힣]/);
  if(hangulIdx <= 0) return null;

  let wordPart = text.slice(0, hangulIdx).trim();
  let meaningPart = text.slice(hangulIdx).trim();

  const openIdx = wordPart.indexOf('(');
  if(openIdx !== -1 && !wordPart.includes(')')){
    meaningPart = wordPart.slice(openIdx) + meaningPart;
    wordPart = wordPart.slice(0, openIdx).trim();
  }

  if(!/^[A-Za-z][A-Za-z\s()'/-]*$/.test(wordPart)) return null;
  if(wordPart.length < 2) return null;

  return {word: wordPart, meaning: meaningPart};
}

function parseLine(line){
  if(line.includes(',')){
    const idx = line.indexOf(',');
    const word = line.slice(0, idx).trim();
    const meaning = line.slice(idx+1).trim();
    if(!word || !meaning || word.toLowerCase() === 'word') return null;
    return {word, meaning};
  }
  return smartParseLine(line);
}

function addSet(){
  const nameInput = document.getElementById('setNameInput');
  const textInput = document.getElementById('textInput');
  const lines = textInput.value.split('\n').map(l => l.trim()).filter(l => l.length > 0);
  const words = lines.map(parseLine).filter(x => x !== null);

  if(words.length < 2){
    alert('최소 2개 이상의 단어를 인식하지 못했습니다. 내용을 확인해주세요.');
    return;
  }

  const sets = loadSets();
  const name = nameInput.value.trim() || `단어장 ${sets.length + 1}`;
  sets.push({ id: 'set_' + Date.now(), name, words, selected: true, mastered: false });
  saveSets(sets);
  nameInput.value = '';
  textInput.value = '';
  document.getElementById('pdfStatus').textContent = '';
  renderSetList();
  alert(`"${name}" 단어장이 저장되었습니다! (${words.length}개)`);
}

/* ===== PDF 업로드 및 텍스트 추출 ===== */
async function extractPdfLines(file){
  const arrayBuffer = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data: arrayBuffer}).promise;
  let allLines = [];

  for(let pageNum = 1; pageNum <= pdf.numPages; pageNum++){
    const page = await pdf.getPage(pageNum);
    const viewport = page.getViewport({scale: 1});
    const textContent = await page.getTextContent();

    const items = textContent.items.filter(it => {
      const [a,b,c] = it.transform;
      return Math.abs(b) < 0.01 && Math.abs(c) < 0.01;
    });

    const rows = [];
    items.forEach(it => {
      const x = it.transform[4], y = it.transform[5];
      let row = rows.find(r => Math.abs(r.y - y) < 3);
      if(!row){ row = {y, items:[]}; rows.push(row); }
      row.items.push({x, str: it.str});
    });
    rows.forEach(r => r.items.sort((a,b) => a.x - b.x));

    const threshold = viewport.width / 2;
    const leftRows = [], rightRows = [];
    rows.forEach(r => {
      const avgX = r.items.reduce((s,i) => s+i.x, 0) / r.items.length;
      const text = r.items.map(i => i.str).join(' ').replace(/\s+/g,' ').trim();
      if(!text) return;
      (avgX < threshold ? leftRows : rightRows).push({y:r.y, text});
    });
    leftRows.sort((a,b) => b.y - a.y);
    rightRows.sort((a,b) => b.y - a.y);

    allLines = allLines.concat(leftRows.map(r=>r.text), rightRows.map(r=>r.text));
  }
  return allLines;
}

async function handlePdfUpload(file){
  const statusEl = document.getElementById('pdfStatus');
  try{
    statusEl.textContent = '📄 PDF 분석 중...';
    const rawLines = await extractPdfLines(file);
    const parsed = rawLines.map(smartParseLine).filter(x => x !== null);

    if(parsed.length === 0){
      statusEl.textContent = '단어를 찾지 못했어요. 아래 텍스트 박스에 직접 붙여넣어 주세요.';
      return;
    }

    const csvText = parsed.map(p => `${p.word},${p.meaning}`).join('\n');
    const textInput = document.getElementById('textInput');
    textInput.value = textInput.value ? textInput.value + '\n' + csvText : csvText;
    statusEl.textContent = `✅ ${parsed.length}개 추출 완료! 아래 내용을 확인 후 "단어장 저장"을 눌러주세요.`;
  } catch(err){
    console.error(err);
    statusEl.textContent = '⚠️ PDF를 읽는 중 오류가 발생했습니다. (형식이 다른 PDF일 수 있어요)';
  }
}

document.getElementById('pdfFileInput').addEventListener('change', function(e){
  const file = e.target.files[0];
  if(file) handlePdfUpload(file);
});

/* ===== 퀴즈 로직 ===== */
function getSelectedWords(){
  const sets = loadSets().filter(s => s.selected);
  const map = new Map();
  sets.forEach(s => s.words.forEach(w => map.set(w.word.toLowerCase(), w)));
  return Array.from(map.values());
}

let words = [], questions = [], currentIndex = 0, hearts = 5, score = 0, wrongAnswers = [];

function shuffle(arr){ return arr.sort(() => Math.random() - 0.5); }

function generateQuestions(list){
  const qs = [];
  list.forEach(item => {
    const type = Math.floor(Math.random() * 3);
    if(type === 0 && list.length >= 4){
      const distractors = shuffle(list.filter(w => w.word !== item.word)).slice(0,3).map(w => w.meaning);
      qs.push({kind:'mc', prompt:`"${item.word}" 의 뜻은?`, answer:item.meaning, options:shuffle([item.meaning, ...distractors]), word:item.word});
    } else if(type === 1 && list.length >= 4){
      const distractors = shuffle(list.filter(w => w.word !== item.word)).slice(0,3).map(w => w.word);
      qs.push({kind:'mc', prompt:`"${item.meaning}" 에 해당하는 단어는?`, answer:item.word, options:shuffle([item.word, ...distractors]), word:item.word});
    } else {
      qs.push({kind:'typing', prompt:`"${item.meaning}" 를 영어로 입력하세요`, answer:item.word, word:item.word});
    }
  });
  return shuffle(qs);
}

/* ★ 괄호 제거 정규식 수정 (기존에 깨져 있던 부분) ★ */
function normalizeTypingAnswer(word){
  return word.replace(/$$[^)]*$$/g, '').replace(/\s+/g,' ').trim().toLowerCase();
}

/* ★ 새로 추가: 힌트 생성 함수 (앞 2글자만 보여주고 나머지는 _ 처리) ★ */
function generateHint(word){
  const clean = normalizeTypingAnswer(word);
  return clean.split('').map((ch, idx) => idx < 2 ? ch : '_').join(' ');
}

function startQuizFromSelected(){
  words = getSelectedWords();
  if(words.length < 2){
    alert('퀴즈를 시작하려면 최소 2개 이상의 단어가 선택되어야 합니다.');
    return;
  }
  questions = generateQuestions(words);
  currentIndex = 0; hearts = 5; score = 0; wrongAnswers = [];
  document.getElementById('setup').classList.add('hidden');
  document.getElementById('quiz').classList.remove('hidden');
  showQuestion();
}

function updateTop(){
  document.getElementById('hearts').textContent = '❤️'.repeat(hearts) + '🖤'.repeat(5-hearts);
  document.getElementById('scoreText').textContent = '점수: ' + score;
  document.getElementById('progressBar').style.width = (currentIndex / questions.length) * 100 + '%';
}

function showQuestion(){
  updateTop();
  if(currentIndex >= questions.length || hearts <= 0){ endQuiz(); return; }
  const q = questions[currentIndex];
  document.getElementById('questionText').textContent = q.prompt;
  const optionsDiv = document.getElementById('options');
  const typingArea = document.getElementById('typingArea');
  optionsDiv.innerHTML = '';

  if(q.kind === 'mc'){
    typingArea.classList.add('hidden');
    optionsDiv.classList.remove('hidden');
    q.options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'option';
      btn.textContent = opt;
      btn.onclick = () => checkMC(opt, q, btn);
      optionsDiv.appendChild(btn);
    });
  } else {
    optionsDiv.classList.add('hidden');
    typingArea.classList.remove('hidden');
    const input = document.getElementById('typingInput');
    input.value = '';
    input.focus();
    /* ★ 새로 추가: 힌트 표시 ★ */
    document.getElementById('typingHint').textContent = generateHint(q.answer);
  }
}

function checkMC(selected, q, btnEl){
  document.querySelectorAll('.option').forEach(b => b.disabled = true);
  if(selected === q.answer){
    btnEl.classList.add('correct'); score += 10;
  } else {
    btnEl.classList.add('wrong'); hearts--; wrongAnswers.push(q);
    document.querySelectorAll('.option').forEach(b => { if(b.textContent === q.answer) b.classList.add('correct'); });
  }
  setTimeout(() => { currentIndex++; showQuestion(); }, 900);
}

function checkTyping(){
  const q = questions[currentIndex];
  const val = normalizeTypingAnswer(document.getElementById('typingInput').value);
  if(val === normalizeTypingAnswer(q.answer)){
    score += 10;
  } else {
    hearts--; wrongAnswers.push(q);
    alert('정답: ' + q.answer);
  }
  currentIndex++;
  showQuestion();
}

function endQuiz(){
  document.getElementById('quiz').classList.add('hidden');
  document.getElementById('result').classList.remove('hidden');
  document.getElementById('resultTitle').textContent = hearts > 0 ? '🎉 완료!' : '💔 하트를 모두 소진했어요';
  document.getElementById('resultScore').textContent = `최종 점수: ${score} / ${questions.length * 10}`;
  const wrongDiv = document.getElementById('wrongList');
  wrongDiv.innerHTML = wrongAnswers.length > 0
    ? '<h3>오답 노트</h3>' + wrongAnswers.map(w => `<p>${w.word} — 정답: ${w.answer}</p>`).join('')
    : '<p>틀린 문제가 없어요! 완벽해요 👏</p>';
}

function backToSetup(){
  document.getElementById('result').classList.add('hidden');
  document.getElementById('setup').classList.remove('hidden');
  renderSetList();
}

/* 초기 렌더링 (로그인 여부 확인 전 임시로 게스트 모드 표시) */
updateAuthUI();
renderSetList();
</script>
</body>
</html>
